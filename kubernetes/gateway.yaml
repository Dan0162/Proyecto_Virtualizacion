apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: proyecto-2-powerrangers
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: lu0512/elquetzal-gateway:latest
        ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: proyecto-2-powerrangers
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80