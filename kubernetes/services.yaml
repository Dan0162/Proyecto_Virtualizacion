apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: proyecto-2-powerrangers
spec:
  type: ClusterIP
  selector:
    app: postgres-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

