apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: proyecto-2-powerrangers
  labels:
    app: catalogo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
      - name: catalogo
        image: lu0512/elquetzal-catalogo:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        - name: DB_NAME
          value: "catalogo_db"
        - name: DB_USER
          value: "catalogo_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret  
              key: CATALOGO_DB_PASSWORD
---
