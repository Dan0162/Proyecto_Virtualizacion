apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: proyecto-2-powerrangers
  labels:
    app: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
      - name: pedidos
        image: lu0512/elquetzal-pedidos:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        - name: DB_NAME
          value: "pedidos_db"
        - name: DB_USER
          value: "pedidos_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: PEDIDOS_DB_PASSWORD
        # Pedidos necesita comunicarse internamente con inventario y catalogo:
        - name: INVENTARIO_URL
          value: "http://inventario:5000"
        - name: CATALOGO_URL
          value: "http://catalogo:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportes
  namespace: proyecto-2-powerrangers
  labels:
    app: reportes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reportes
  template:
    metadata:
      labels:
        app: reportes
    spec:
      containers:
      - name: reportes
        image: lu0512/elquetzal-reportes:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        ## Lo de DB_NAME y DB_PASSWORD de reportes se deberia eliminar
        ## despues de actualizar las imagenes
        - name: DB_NAME
          value: "reportes_db"
        - name: DB_USER
          value: "reportes_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REPORTES_DB_PASSWORD
        # URLs de comunicación interna
        - name: CATALOGO_URL
          value: "http://catalogo:5000"
        - name: INVENTARIO_URL
          value: "http://inventario:5000"
        - name: PEDIDOS_URL
          value: "http://pedidos:5000"