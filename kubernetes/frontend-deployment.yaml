apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: proyecto-2-powerrangers
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: lu0512/elquetzal-frontend:latest
          ports:
            - containerPort: 80