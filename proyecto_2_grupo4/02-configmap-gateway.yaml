apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    equipo: grupo-4
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # / va al frontend por el nombre DNS del Service
      location / {
        proxy_pass           http://frontend-grupo-4:80/;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
      }


      location /api/catalogo/ {
        proxy_pass          http://catalogo-grupo-4:5000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      }


      location /api/inventario/ {
        proxy_pass          http://inventario-grupo-4:5000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      }


      location /api/clientes/ {
        proxy_pass          http://clientes-grupo-4:5000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      }


      location /api/pedidos/ {
        proxy_pass          http://pedidos-grupo-4:5000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      }


      location /api/reportes/ {
        proxy_pass          http://reportes-grupo-4:5000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
