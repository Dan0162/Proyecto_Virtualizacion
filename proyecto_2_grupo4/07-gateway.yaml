apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: gateway
    equipo: grupo-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        equipo: grupo-4
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: gateway-conf-grupo-4
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: gateway
    equipo: grupo-4
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: gateway
    equipo: grupo-4
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-lb-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: gateway
    equipo: grupo-4
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 80
