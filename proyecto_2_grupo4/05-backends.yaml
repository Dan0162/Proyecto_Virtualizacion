apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: catalogo
    equipo: grupo-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
        equipo: grupo-4
    spec:
      containers:
        - name: catalogo
          image: docker.io/ishaimaster/elquetzal-catalogo:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config-grupo-4
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config-grupo-4
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config-grupo-4
                  key: CATALOGO_DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config-grupo-4
                  key: CATALOGO_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-grupo-4
                  key: CATALOGO_DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: catalogo
    equipo: grupo-4
spec:
  type: ClusterIP
  selector:
    app: catalogo
  ports:
    - port: 5000
      targetPort: 5000
---
