apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: frontend
    equipo: grupo-4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        equipo: grupo-4
    spec:
      containers:
        - name: frontend
          image: docker.io/ishaimaster/elquetzal-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: frontend
    equipo: grupo-4
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
