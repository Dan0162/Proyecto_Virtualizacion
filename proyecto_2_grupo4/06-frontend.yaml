apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: frontend
    equipo: grupo-4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        equipo: grupo-4
    spec:
      containers:
        - name: frontend
          image: lu0512/elquetzal-frontend:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-grupo-4
  namespace: proyecto-2-grupo-4
  labels:
    app: frontend
    equipo: grupo-4
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
